  lanes_per_link: 4
  lane_rate_bps: 50000000000.0
  collective_algorithm: auto
  execution_backend: astrasim
  active_chunks_per_dimension: 8
  util: 0.8
  overlap: {tp_overlap: 0.0, tp_sp_overlap: 0.0, cp_overlap: 0.0}
  phase_overrides: none
  energy_per_bit: 8.0e-12
  inter_node:
