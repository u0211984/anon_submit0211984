  sku: paper_pipeline/registry.yaml multi_gpu42_vllm title and suite/historical_validation/inference/energy_latency_v6/configs/2gpu_b1_in128_out512.hardware.yaml
    template
  gpus: paper_pipeline/registry.yaml multi_gpu42_vllm title (node capacity); actual run count from measured CSV n_gpus
  interconnect: paper_pipeline/registry.yaml multi_gpu42_vllm assumptions and paper_pipeline/settings/paper.yaml network (NVSwitch represented by FullyConnected)
  power_limit_w: paper_pipeline/registry.yaml multi_gpu42_vllm title (node power limit)
  clock_hz: paper_pipeline/registry.yaml workload.rules.clock, designation C17 and measured CSV sm_mhz_per_gpu
  base_clock_hz: suite/historical_validation/inference/energy_latency_v6/configs/2gpu_b1_in128_out512.hardware.yaml tech_param.core.operating_frequency (template
    clock)
  literature_tier: paper_pipeline/hardware/a100_sxm4_80gb_1275_study.yaml and a100_literature.py Live paper tier
  base: suite/historical_validation/inference/energy_latency_v6/cases.csv hardware_config and referenced inference hardware config
  base_sha256: SHA-256 of base.inference bytes, first 16 hexadecimal characters
runtime_field_sources:
  tech_param.core.operating_frequency: mean measured CSV sm_mhz_per_gpu (one clock per GPU), MHz converted to Hz; designation C17
  parallelism.tp: measured CSV n_gpus for inference tensor parallel runs
  tech_param.core.nominal_energy_per_flop: 'a100_literature.py core_energy: Antepara SC 2025 matrix FP16 x Schoonhoven V-f interpolation'
  tech_param.core.tensor_energy_per_flop: 'a100_literature.py core_energy: Antepara SC 2025 matrix FP16 x Schoonhoven V-f interpolation'
  tech_param.core.vector_energy_per_flop: 'a100_literature.py core_energy: Antepara SC 2025 vector FP16 x Schoonhoven V-f interpolation'
  tech_param.core.padded_tensor_energy_per_flop: 'a100_literature.py core_energy: Antepara SC 2025 matrix control x Schoonhoven V-f interpolation'
  tech_param.core.device_fixed_overhead_cycles: 'a100_literature.py launch_floor_cycles: TaxBreak 5 us x measured frequency'
  static_power_w: 'a100_literature.py STATIC_POWER_W: Antepara SC 2025 constant power'
  tech_param.DRAM.bandwidth: 'a100_literature.py DRAM_SPEC_BPS and MEMORY_BANDWIDTH_FRACTION: vendor SXM4 80GB peak x RAPID-LLM calibration'
  tech_param.DRAM.dynamic_energy_per_sector: 'a100_literature.py per_byte_energy: Antepara SC 2025 energy x Schoonhoven V-f interpolation x inherited 32-byte sector'
  tech_param.DRAM.latency: inherited study latency_cycles divided by measured clock in a100_literature.py; Luo et al. Table 3 (https://arxiv.org/abs/2501.12084)
  tech_param.DRAM.util: a100_literature.py transform paper tier; inherited model policy value 1.0
  tech_param.SRAM-L2.dynamic_energy_per_sector: 'a100_literature.py per_byte_energy: Antepara SC 2025 energy x Schoonhoven V-f interpolation x inherited 32-byte sector'
  tech_param.SRAM-L2.latency: inherited study latency_cycles divided by measured clock in a100_literature.py; Luo et al. Table 3 (https://arxiv.org/abs/2501.12084)
  tech_param.SRAM-L2.util: a100_literature.py transform paper tier; inherited model policy value 1.0
  tech_param.SRAM-L1.dynamic_energy_per_sector: 'a100_literature.py per_byte_energy: Antepara SC 2025 energy x Schoonhoven V-f interpolation x inherited 32-byte sector'
  tech_param.SRAM-L1.latency: inherited study shared-memory latency_cycles divided by measured clock in a100_literature.py; Luo et al. Table 3 (https://arxiv.org/abs/2501.12084)
  tech_param.SRAM-L1.util: a100_literature.py transform paper tier; inherited model policy value 1.0
  tech_param.SRAM-L2.bandwidth: 'a100_literature.py bandwidth constant: Antepara SC 2025 at 1410 MHz, scaled linearly by measured clock'
  tech_param.SRAM-L1.bandwidth: 'a100_literature.py bandwidth constant: Antepara SC 2025 at 1410 MHz, scaled linearly by measured clock'
  tech_param.SRAM-R.dynamic_energy_per_byte: 'a100_literature.py REGISTER_PJ_PER_BYTE: Antepara SC 2025 register energy folded into FPU energies'
  tech_param.core.matrix_unit.util: 'a100_literature.py MATRIX_UTIL: RAPID-LLM calibration rule'
  sw_param.inference_step_overhead: 'a100_literature.py DECODE_STEP_OVERHEAD_S: measured vLLM A100 PCIe; paper setting C14/F7'
  sw_param.inference_prefill_overhead: 'a100_literature.py PREFILL_OVERHEAD_S: measured vLLM A100 PCIe; paper setting C14/F7'
