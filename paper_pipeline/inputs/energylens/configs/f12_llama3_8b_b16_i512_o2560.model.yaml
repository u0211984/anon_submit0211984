model_param:
  mode: LLM
  run_type: inference
  tied_embeddings: false
  model_type: llama
  global_batch_size: 16
  gradient_accumulation_steps: 1
  seq_len: 3072
  decode_len: 2560
  hidden_dim: 4096
  attention:
    attention_type: gqa
    num_heads: 32
    kv_heads: 8
    use_flashattention: true
    attention_tile_size: 128
    use_rope: true
  moe:
    num_experts: 1
    top_k: 1
    moe_intermediate_size: 14336
    n_shared_experts: 0
    moe_layer_freq: 1
    first_k_dense_replace: 32
  intermediate_size: 14336
  vocab_size: 128256
  num_layers: 32
inference_param:
  sample_every: -1
